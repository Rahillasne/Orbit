[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-robotics"
version = "1.2.0"
description = "Analyze robot datasets to predict task capability, identify distribution gaps, and prescribe what data to collect next."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.13"
authors = [
    {name = "Rahil Lasne"},
]
keywords = ["sim-to-real", "dataset-analysis", "robot-learning", "data-quality",
            "distribution-gap", "LeRobot", "policy-transfer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "h5py>=3.8.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "filelock>=3.12.0",
    "Pillow>=9.5.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
profile = [
    "faiss-cpu>=1.7.4",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "hdbscan>=0.8.33",
    "Pillow>=9.5.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "open-clip-torch>=2.20.0",
    "umap-learn>=0.5.3",
    "sentencepiece>=0.1.99",
]
detection = [
    "pandas>=2.0.0",
]
vlm = [
    "openai>=1.0",
    "anthropic>=0.20.0",
]
dashboard = [
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "pandas>=2.0.0",
]
lerobot = [
    "lerobot>=0.4.0",
]
gpu = [
    "lerobot>=0.4.0",
    "torch>=2.0.0",
]
loader = [
    "huggingface_hub>=0.20.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
]
r3m = [
    "r3m",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
voltron = [
    "voltron-robotics",
    "torch>=2.0.0",
]
full = [
    "orbit-robotics[profile,detection,vlm,dashboard,lerobot,r3m]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "modal>=0.64.0",
]

[project.urls]
Homepage = "https://github.com/Rahillasne/Orbit"
Documentation = "https://github.com/Rahillasne/Orbit#readme"
Repository = "https://github.com/Rahillasne/Orbit"
Issues = "https://github.com/Rahillasne/Orbit/issues"

[project.scripts]
orbit = "orbit.cli:cli"
orbit-dashboard = "orbit.dashboard.app:main"
orbit-detect = "orbit.detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
